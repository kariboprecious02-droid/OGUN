# Cloud Build — auto-deploy to staging on push
#
# Triggers on pushes to the development branch. Builds + deploys BOTH
# the API (Express) and the admin dashboard (Next.js) to their
# respective staging Cloud Run services.
#
# Production is NEVER touched by this pipeline. Promote via the
# cloudbuild.prod.yaml trigger with a [promote] commit marker.

steps:
  # ---------- API: build + push ----------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ogun-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ogun-api:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-api-sha'
    args: ['push', 'gcr.io/$PROJECT_ID/ogun-api:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-api-latest'
    args: ['push', 'gcr.io/$PROJECT_ID/ogun-api:latest']

  # ---------- Admin: build + push ----------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-admin'
    args:
      - 'build'
      - '--build-arg'
      - 'COMMIT_SHA=$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ogun-admin:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ogun-admin:latest'
      - '-f'
      - 'apps/admin/Dockerfile'
      - 'apps/admin'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-admin-sha'
    args: ['push', 'gcr.io/$PROJECT_ID/ogun-admin:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-admin-latest'
    args: ['push', 'gcr.io/$PROJECT_ID/ogun-admin:latest']

  # ---------- Deploy both to staging ----------
  # NOTE: --traffic=LATEST=100 is NOT a valid gcloud run deploy flag (a73cb62
  # introduced it and broke every deploy since). The supported pattern is:
  #   1. deploy the new revision (default routes 100% to it on auto-traffic services)
  #   2. explicitly call `update-traffic --to-latest` as belt-and-suspenders for
  #      services that may have ended up in manual-traffic mode.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-api-staging'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ogun-api-staging'
      - '--image=gcr.io/$PROJECT_ID/ogun-api:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--quiet'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'flip-traffic-api-staging'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'ogun-api-staging'
      - '--region=us-central1'
      - '--platform=managed'
      - '--to-latest'
      - '--quiet'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-admin-staging'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ogun-admin-staging'
      - '--image=gcr.io/$PROJECT_ID/ogun-admin:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--update-env-vars=OGUN_API_BASE_URL=https://ogun-api-staging-552820821813.us-central1.run.app/v1'
      - '--quiet'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'flip-traffic-admin-staging'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'ogun-admin-staging'
      - '--region=us-central1'
      - '--platform=managed'
      - '--to-latest'
      - '--quiet'

images:
  - 'gcr.io/$PROJECT_ID/ogun-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/ogun-api:latest'
  - 'gcr.io/$PROJECT_ID/ogun-admin:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/ogun-admin:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
