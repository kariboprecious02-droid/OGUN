const genKey = prefix => {
  const rnd = Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10);
  return `${prefix}_${rnd}`;
};
const maskKey = k => {
  if (!k) return "";
  if (k.length < 12) return k;
  return k.slice(0, 7) + "•".repeat(Math.max(0, k.length - 11)) + k.slice(-4);
};

  if (s <= 0) return "0s";
