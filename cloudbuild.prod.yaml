# Cloud Build — production promote via commit message
#
# Triggered by ANY push to the development branch, but only actually
# deploys when the triggering commit's message includes "[promote]"
# (case-insensitive). Any other commit is a no-op that exits cleanly.
#
# This design lets Claude trigger production promotes from the Ogun
# sandbox using only `git commit && git push` — no git tag required.
# The sandbox's git proxy blocks tag pushes but allows branch pushes.
#
# Safety:
#   - The "[promote]" marker must be explicit. Regular commits don't
#     touch prod.
#   - The user gates production by saying "promote to prod" in chat;
#     Claude only creates commits with [promote] after that approval.
#   - The :latest image (validated by staging) is deployed — no rebuild.
#
# Flow:
#   1. Claude pushes a feature commit → staging auto-deploys (cloudbuild.yaml)
#   2. User verifies staging, says "ship it"
#   3. Claude creates an empty commit: `git commit --allow-empty -m "[promote] v1.0.1"`
#   4. This trigger fires, detects [promote] in the message, deploys to prod
#   5. Any subsequent non-[promote] pushes do NOT touch prod

steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        # Fetch the commit message for this build.
        # NOTE: Cloud Build's substitution engine processes this YAML before
        # handing it to bash. Cloud Build built-ins ($COMMIT_SHA, $PROJECT_ID)
        # are resolved by Cloud Build. Shell-only variables MUST be escaped
        # with $$ so bash receives a literal $ sign.
        COMMIT_MSG=$$(git log -1 --format=%s $COMMIT_SHA 2>/dev/null || echo "")
        echo "Commit message: $$COMMIT_MSG"

        # Exit cleanly if [promote] is not present (case-insensitive)
        if ! echo "$$COMMIT_MSG" | grep -iq '\[promote\]'; then
          echo "No [promote] marker found in commit message — skipping production deploy."
          echo "This is expected for normal staging-only commits."
          exit 0
        fi

        echo "[promote] marker detected — promoting :latest images to production."

        # Verify both :latest images exist
        API_IMAGE="gcr.io/$PROJECT_ID/ogun-api:latest"
        ADMIN_IMAGE="gcr.io/$PROJECT_ID/ogun-admin:latest"

        if ! gcloud container images describe $$API_IMAGE --format='value(image_summary.digest)' >/dev/null 2>&1; then
          echo "ERROR: $$API_IMAGE does not exist. Push a code commit first so staging builds :latest."
          exit 1
        fi

        # Admin image is optional — if it doesn't exist yet (first run before
        # the admin was added to the staging pipeline), skip admin deploy
        # rather than failing the whole promote.
        ADMIN_EXISTS=true
        if ! gcloud container images describe $$ADMIN_IMAGE --format='value(image_summary.digest)' >/dev/null 2>&1; then
          echo "WARN: $$ADMIN_IMAGE does not exist — skipping admin promote."
          ADMIN_EXISTS=false
        fi

        # Deploy API to production
        gcloud run deploy ogun-api-prod \
          --image=$$API_IMAGE \
          --region=us-central1 \
          --platform=managed \
          --quiet

        gcloud run services update-traffic ogun-api-prod \
          --region=us-central1 \
          --platform=managed \
          --to-latest \
          --quiet

        # Deploy admin to production (service name: ogun-admin)
        if [ "$$ADMIN_EXISTS" = "true" ]; then
          gcloud run deploy ogun-admin \
            --image=$$ADMIN_IMAGE \
            --region=us-central1 \
            --platform=managed \
            --update-env-vars=OGUN_API_BASE_URL=https://ogun-api-prod-552820821813.us-central1.run.app/v1 \
            --quiet

          gcloud run services update-traffic ogun-admin \
            --region=us-central1 \
            --platform=managed \
            --to-latest \
            --quiet
        fi

        echo "============================================"
        echo "  PROMOTED TO PRODUCTION"
        echo "============================================"
        echo "  Commit:       $COMMIT_SHA"
        echo "  Message:      $$COMMIT_MSG"
        echo "  API image:    $$API_IMAGE"
        echo "  API service:  ogun-api-prod"
        if [ "$$ADMIN_EXISTS" = "true" ]; then
          echo "  Admin image:  $$ADMIN_IMAGE"
          echo "  Admin service: ogun-admin"
        else
          echo "  Admin:        SKIPPED (image not yet built)"
        fi
        echo "============================================"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '600s'
