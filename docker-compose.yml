services:
  postgres:
    image: postgres:16-alpine
    container_name: ogun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ogun
      POSTGRES_PASSWORD: ogun
      POSTGRES_DB: ogun_dev
    ports:
      - "5432:5432"
    volumes:
      - ogun-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogun -d ogun_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ogun-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ogun-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ogun-postgres-data:
  ogun-redis-data:
